services:
  app:
    build: .
    environment:
      - KTH_ISSUER_URL=http://127.0.0.1:8200/v1/identity/oidc/provider/default
      - KTH_CLIENT_ID=IfRgMkBRz4HYakXn6UYYMibNDzGXDN6V
      - KTH_CLIENT_SECRET=hvo_secret_Ozzn8luZDheNqtqdSQ2udHwfT1HAl20gLEx0P7pT2XZgRnr56WK8VTVJ2IAZvYUq
      - KTH_RP_ORIGIN=http://localhost:7000
      - OIDC_PROVIDER_ISSUER_URL=http://localhost:7000/op
      - OIDC_PROVIDER_,
      - ORIGIN=http://localhost:7000
      - DEV=true
      - PORT=7000
      - DATABASE_URL=postgresql://sso:sso@db:5432/sso
      - LDAP_PROXY_URL=http://nyckeln:7005
      # - PLS_URL=https://pls.datasektionen.se
      - HIVE_URL=http://nyckeln:7004
      - HIVE_API_KEY=1234567890abcdefabcdef
      - RFINGER_URL=http://dock:9003
      - RFINGER_API_KEY=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
      - SPAM_URL=http://spam:8000
      - SPAM_API_KEY=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
    ports:
      - 7000:7000
    depends_on:
      db:
        condition: service_healthy

  # vault:
  #   image: hashicorp/vault:latest
  #   container_name: vault
  #   cap_add:
  #     - IPC_LOCK  # Lock memory to prevent sensitive data from swapping to disk
  #   environment:
  #     VAULT_DEV_ROOT_TOKEN_ID: myroot  # Root token for dev mode
  #     VAULT_ADDR: http://vault:8200  # Set the Vault address
  #     VAULT_API_ADDR: http://vault:8200  # Set the Vault address
  #   ports:
  #     - "8200:8200"  # Expose Vault on port 8200
  #   command: server -dev  # Start Vault in development mode
  #   volumes:
  #     - vault-data:/vault/file  # For future use, persistent storage in production
  #   healthcheck:
  #     test: ["CMD", "vault", "status"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  spam:
    image: ghcr.io/datasektionen/spam-rs:latest
    ports:
      - 8000:8000
    environment:
      RUST_LOG: debug
      HOST_ADDRESS: 0.0.0.0
      PORT: 8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: aws-ses-v2-local
      AWS_ENDPOINT_URL: http://aws-ses-v2-local:8005
      APP_SECRET: insert-app-secret
      HIVE_URL: http://nyckeln:7004/api/v1
      HIVE_SECRET: 1234567890abcdefabcdef
  smtp:
    image: changemakerstudiosus/papercut-smtp
    container_name: smtp
    ports:
      - 8080:8080
      - 2525:2525
    environment:
      Urls: http://0.0.0.0:8080
      SmtpServer__Port: 2525

  aws-ses:
    container_name: aws-ses-v2-local
    hostname: aws-ses-v2-local
    image: ghcr.io/domdomegg/aws-ses-v2-local
    environment:
      AWS_SES_ACCOUNT: '{"SendQuota":{"Max24HourSend":1000000,"MaxSendRate":250,"SentLast24Hours":0}}'
      SMTP_TRANSPORT: '{"host":"smtp","port":2525,"secure":false}'
    working_dir: /srv/www/dist
    ports:
      - "8005:8005"
    expose:
      - 8005

  db:
    image: 'postgres:latest'
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d sso -U sso'"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nyckeln:
    image: ghcr.io/datasektionen/nyckeln-under-dorrmattan
    configs:
      - source: nyckeln.yaml
        target: /config.yaml
    ports:
      - 7004:7004
      - 7005:7005

  dock:
    image: ghcr.io/datasektionen/dock:latest
    configs:
      - source: dock.yaml
        target: /config.yaml
    ports:
      - 9003:9003



volumes:
  vault-data:

configs:
  dock.yaml:
    content: |
      rfinger:
        default: http://localhost:9003
        pictures:
          turetek:
            regular: https://thskth.se/wp-content/uploads/2023/06/ths-logo-bla-01-300x294-1.png
            small: https://thskth.se/wp-content/uploads/2019/12/ths-logo-svart-01.png
          diadat:
            regular: https://dsekt-assets.s3.amazonaws.com/logotyp
            small: https://dsekt-assets.s3.amazonaws.com/logotyp
          marmed:
            regular: https://storage.googleapis.com/medieteknik-static/static/logos/logo.webp
            small: https://storage.googleapis.com/medieteknik-static/static/logos/logo.webp

  nyckeln.yaml:
    content: |
      users:
        - ug_kth_id: some-id
          kth_id: turetek
          email: turetek@kth.se
          first_name: Ture
          family_name: Teknolog
          year_tag: D-83
        - ug_kth_id: some-other-id
          kth_id: diadat
          email: diadat@kth.se
          first_name: Diana
          family_name: Datalog
          year_tag: D-83
        - ug_kth_id: yet-anouther-id
          kth_id: marmed
          email: marmed@kth.se
          first_name: Martin
          family_name: Median
          year_tag: M-00
        - ug_kth_id: even-more
          kth_id: karklu
          email: karklu@kth.se
          first_name: Karin
          family_name: Klubbare
          year_tag: D-85

      ldap:
        - ug_kth_id: some-other-id
          kth_id: marmas
          first_name: Markus
          family_name: Maskinare
        - ug_kth_id: yet-some-other-id
          kth_id: turetek
          first_name: Ture
          family_name: Teknolog

      hive:
        tokens:
          - secret: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
            permissions:
            - id: send
            - id: get

        groups:
          - name: Systemansvarig
            id: d-sys
            domain: example.com
            members:
              - turetek
            permissions:
              - id: read-members
              - id: manage-members
              - id: manage-account-requests
              - id: read-account-requests
              - id: read-name-change-requests
              - id: manage-name-change-requests
              - id: read-invites
              - id: read-oidc-clients
              - id: write-invites
              - id: write-members
              - id: write-oidc-clients
                scope: "*"
